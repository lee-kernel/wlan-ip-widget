name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Build native Windows x64 executable
        shell: cmd
        run: |
          if not exist publish mkdir publish
          cl /nologo /O2 /MT /std:c++17 /DUNICODE /D_UNICODE /Fo:publish\ /Fe:publish\WlanIp.exe WlanIp.cpp /link /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF
      - uses: actions/upload-artifact@v4
        with:
          name: WlanIp-win-x64
          path: publish/WlanIp.exe
          if-no-files-found: error
